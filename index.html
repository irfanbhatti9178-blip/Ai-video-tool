<!DOCTYPE html><html><body>
<h2>Prompt Likho</h2>
<input id="p" style="width:300px" placeholder="cute cat dancing in garden">
<button onclick="gen()">Generate Video</button>
<p id="s"></p>
<video id="v" controls style="width:90%;max-width:400px;display:none"></video>
<script>
async function gen(){
  const prompt=document.getElementById('p').value;
  const s=document.getElementById('s');
  const v=document.getElementById('v');
  if(!prompt) return alert("Prompt likho");
  s.innerText="Video ban raha hai, 40 sec wait...";
  v.style.display="none";
  const res=await fetch('/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
  if(!res.ok){
    const err=await res.text();
    s.innerText="ERROR: "+err;
    return;
  }
  const blob=await res.blob();
  v.src=URL.createObjectURL(blob);
  v.style.display="block";
  s.innerText="Ho gaya!";
}
</script>
</body></html>
