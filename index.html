<!DOCTYPE html>
<html>
<head><title>Free AI Video Generator</title></head>
<body>
  <h2>Prompt Likho</h2>
  <input id="prompt" placeholder="a cat dancing in rain" style="width:300px">
  <button onclick="generate()">Generate Video</button>
  <p id="status"></p>
  <video id="video" controls style="width:400px; display:none;"></video>

<script>
async function generate(){
  document.getElementById('status').innerText = "Video ban raha hai, 1-2 min lagega...";
  const res = await fetch('/api/generate', {
    method: 'POST',
    body: JSON.stringify({ prompt: document.getElementById('prompt').value })
  });
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const v = document.getElementById('video');
  v.src = url; v.style.display = 'block';
  document.getElementById('status').innerText = "Ho gaya!";
}
</script>
</body>
</html>
